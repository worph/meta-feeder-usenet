[package]
name = "usenet-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Usenet feeder sidecar: bridges a Usenet header scan we run OURSELVES into the
# MetaMesh network. Unlike `meta-feeder-indexer` (which proxies an external
# Newznab/torznab indexer) this feeder owns the metadata half — it reads an
# nntmux indexer (the NNTmux app, over its Newznab API) and mints a PORTABLE `nzb-posting` (0x1003)
# cid from the article Message-IDs, so any peer with a plain NNTP provider can
# redeem it without an indexer credential.
#
# It ADDS a Usenet metadata source alongside meta-feeder-indexer; it does not
# replace it. It also REDEEMS external `nzb-release` (0x1005) locators through
# `/compute`, grabbing the .nzb with per-host indexer keys set on its config
# page. Like every feeder it is meta-core-free + blockstore-free (the gateway
# core owns hashing/seeding/store-back — see the gateway's invariant 10).
#
# See `meta-gateway/docs/others/self-hosted-usenet-indexer-study.md`.

[lib]
name = "usenet_feeder"
path = "src/lib.rs"

[[bin]]
name = "usenet-feeder"
path = "src/main.rs"

[dependencies]
# Pinned by TAG, never by path. A path dep resolves OUTSIDE this repo, and this
# repo is the Docker build context. (Until 1.3.0 this repo vendored a copy.)
meta-feeder-sdk = { git = "https://github.com/worph/meta-feeder-sdk", tag = "v1.7.0" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
bytes = "1"
futures = "0.3"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
base64 = "0.22"
tokio = { version = "1.40", features = ["full", "test-util"] }
